title: "Under an Operation servers override the Path Item server no longer applies"
ref: "OpenAPI 3.1.1 §4.8.10.1 (Operation servers field)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: /v1
  paths:
    /pets:
      servers:
        - url: /v2
      get: {responses: {"200": {description: ok}}}
      post:
        servers:
          - url: /v3
        responses: {"200": {description: ok}}
request:
  method: "POST"
  path: "/v2/pets"
expect:
  valid: false
