title: "A server path is stripped as whole segments only, so /v1pets does not start with /v1"
ref: "RFC 3986 §3.3"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: /v1
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/v1pets"
expect:
  valid: false
  kind: "path_not_found"
  location: "path"
