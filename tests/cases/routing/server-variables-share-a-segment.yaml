title: "Two server variables without enum in one segment each take a value"
ref: "OpenAPI 3.1.1 §4.8.6 (Server Variable Object)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: /{tenant}-{region}
      variables:
        tenant: {default: acme}
        region: {default: eu}
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/other-us/pets"
expect:
  valid: true
