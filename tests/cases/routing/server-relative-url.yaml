title: "A relative server URL v1 resolves to the path /v1"
ref: "OpenAPI 3.1.1 §4.7 (Relative References in API URLs)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: v1
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/v1/pets"
expect:
  valid: true
