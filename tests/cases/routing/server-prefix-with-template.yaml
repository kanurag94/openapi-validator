title: "After stripping the server path, templates match the remainder"
ref: "OpenAPI 3.1.1 §4.8.5 (Server Object)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers: [{url: /v1}]
  paths:
    /pets/{id}:
      get: {parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}
request:
  method: "GET"
  path: "/v1/pets/x"
expect:
  valid: false
  kind: "invalid_parameter"
  location: "path.id"
