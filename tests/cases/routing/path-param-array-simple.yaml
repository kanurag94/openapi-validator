title: "A simple-style array path parameter is split on commas and items checked"
ref: "OpenAPI 3.1.1 §4.8.12.4 (Style Examples)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /pets/{ids}:
      get:
        parameters: [{name: ids, in: path, required: true, schema: {type: array, items: {type: integer}}}]
        responses: {"200": {description: ok}}
request:
  method: "GET"
  path: "/pets/1,2,x"
expect:
  valid: false
  kind: "invalid_parameter"
