title: "A server variable inside a segment is substituted within that segment"
ref: "OpenAPI 3.1.1 §4.8.6 (Server Variable Object)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: /api-{ver}
      variables:
        ver: {default: '1', enum: ['1', '2']}
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/api-2/pets"
expect:
  valid: true
