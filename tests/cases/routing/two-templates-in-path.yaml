title: "Two template segments each capture their own value"
ref: "OpenAPI 3.1.1 §4.8.8.2 (Path Templating Matching)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /users/{uid}/orders/{oid}:
      get:
        parameters:
          - {name: uid, in: path, required: true, schema: {type: integer}}
          - {name: oid, in: path, required: true, schema: {type: integer}}
        responses: {"200": {description: ok}}
request:
  method: "GET"
  path: "/users/3/orders/9"
expect:
  valid: true
