title: "With server_paths ignored, the server path is not stripped"
ref: "OpenAPI 3.1.1 §4.8.5 (Server Object)"
options:
  server_paths: "ignored"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: /v1
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/v1/pets"
expect:
  valid: false
  kind: "path_not_found"
  location: "path"
