title: "A path value that does not satisfy the parameter schema is invalid"
ref: "OpenAPI 3.1.1 §4.8.12.1 (Parameter Locations, path)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /pets/{id}:
      get: {parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}
request:
  method: "GET"
  path: "/pets/abc"
expect:
  valid: false
  kind: "invalid_parameter"
  location: "path.id"
