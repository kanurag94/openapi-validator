title: "A server variable without enum accepts any value"
ref: "OpenAPI 3.1.1 §4.8.6.1 (enum only for a limited set; default is used if no alternate value is supplied)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: https://api.example.com/{base}
      variables:
        base: {default: api}
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/other/pets"
expect:
  valid: true
