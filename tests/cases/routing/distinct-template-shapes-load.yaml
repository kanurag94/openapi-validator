title: "Templates with different literal structure are not duplicates and the document loads"
ref: "OpenAPI 3.1.1 §4.8.8.2 (Path Templating Matching)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /pets/{id}:
      get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: ok}}}
    /pets/{id}/toys:
      get: {parameters: [{name: id, in: path, required: true, schema: {type: string}}], responses: {"200": {description: ok}}}
request:
  method: "GET"
  path: "/pets/1/toys"
expect:
  valid: true
