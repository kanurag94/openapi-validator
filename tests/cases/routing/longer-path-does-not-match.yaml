title: "A request with extra segments after a declared concrete path does not match it"
ref: "OpenAPI 3.1.1 §4.8.8 (Paths Object)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/pets/toys"
expect:
  valid: false
  kind: "path_not_found"
  location: "path"
