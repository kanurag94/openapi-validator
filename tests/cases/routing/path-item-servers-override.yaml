title: "Path Item servers replace the document servers for that path"
ref: "OpenAPI 3.1.1 §4.8.9.1 (Path Item Object fields)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: /v1
  paths:
    /pets:
      servers:
        - url: /v2
      get: {responses: {"200": {description: ok}}}
      post:
        servers:
          - url: /v3
        responses: {"200": {description: ok}}
request:
  method: "GET"
  path: "/v2/pets"
expect:
  valid: true
