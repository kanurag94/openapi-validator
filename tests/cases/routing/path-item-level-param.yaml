title: "Path parameters declared on the Path Item apply to its operations"
ref: "OpenAPI 3.1.1 §4.8.9.1 (Path Item Object fields)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /pets/{id}:
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      get: {responses: {"200": {description: ok}}}
request:
  method: "GET"
  path: "/pets/x"
expect:
  valid: false
  kind: "invalid_parameter"
  location: "path.id"
