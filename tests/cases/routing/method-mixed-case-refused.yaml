title: "A mixed-case method name Get does not match the GET operation"
ref: "RFC 9110 §9.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "Get"
  path: "/pets"
expect:
  valid: false
  kind: "method_not_allowed"
  location: "method"
