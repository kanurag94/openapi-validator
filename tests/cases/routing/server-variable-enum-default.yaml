title: "A server variable's default value is one of the accepted prefixes"
ref: "OpenAPI 3.1.1 §4.8.6 (Server Variable Object)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: https://api.example.com/{version}
      variables:
        version: {default: v1, enum: [v1, v2]}
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/v1/pets"
expect:
  valid: true
