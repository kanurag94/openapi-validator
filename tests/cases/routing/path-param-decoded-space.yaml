title: "A percent-encoded path value is decoded before schema validation"
ref: "OpenAPI 3.1.1 §4.8.12.1 (Parameter Locations, path)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /users/{name}:
      get:
        parameters: [{name: name, in: path, required: true, schema: {type: string, pattern: '^[a-z]+ [a-z]+$'}}]
        responses: {"200": {description: ok}}
request:
  method: "GET"
  path: "/users/john%20doe"
expect:
  valid: true
