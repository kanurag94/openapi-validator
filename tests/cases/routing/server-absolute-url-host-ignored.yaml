title: "The host of an absolute server URL is not part of the path"
ref: "OpenAPI 3.1.1 §4.8.5 (Server Object)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: https://api.example.com/v1
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/api.example.com/v1/pets"
expect:
  valid: false
  kind: "path_not_found"
  location: "path"
