title: "An operation parameter with the same name and location overrides the Path Item one"
ref: "OpenAPI 3.1.1 §4.8.9.1 (Path Item Object fields)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
