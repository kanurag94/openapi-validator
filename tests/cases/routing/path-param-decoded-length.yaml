title: "maxLength applies to the decoded value, not the encoded text"
ref: "OpenAPI 3.1.1 §4.8.12.1 (Parameter Locations, path)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /codes/{c}:
      get:
        parameters: [{name: c, in: path, required: true, schema: {type: string, maxLength: 3}}]
        responses: {"200": {description: ok}}
request:
  method: "GET"
  path: "/codes/%41%42%43"
expect:
  valid: true
