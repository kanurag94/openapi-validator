title: "A 3.1 document with only webhooks has no paths for requests to match"
ref: "OpenAPI 3.1.1 §4.8.1.1 (webhooks)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  webhooks:
    newPet:
      post: {responses: {"200": {description: ok}}}
request:
  method: "POST"
  path: "/newPet"
expect:
  valid: false
  kind: "path_not_found"
  location: "path"
