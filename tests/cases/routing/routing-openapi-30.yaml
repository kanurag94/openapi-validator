title: "A 3.0 document routes templated paths the same way"
ref: "OpenAPI 3.0.4 §4.8.8.2 (Path Templating Matching)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /pets/{id}:
      get:
        parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
        responses: {"200": {description: ok}}
request:
  method: "GET"
  path: "/pets/x"
expect:
  valid: false
  kind: "invalid_parameter"
  location: "path.id"
