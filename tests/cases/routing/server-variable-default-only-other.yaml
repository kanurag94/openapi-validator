title: "A server variable without enum does not accept arbitrary values"
ref: "OpenAPI 3.1.1 §4.8.6 (Server Variable Object)"
options:
  server_paths: "required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  servers:
    - url: https://api.example.com/{base}
      variables:
        base: {default: api}
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/other/pets"
expect:
  valid: false
  kind: "path_not_found"
  location: "path"
