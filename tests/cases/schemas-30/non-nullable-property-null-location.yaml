title: "A null in a non-nullable nested property is reported at that property"
ref: "OpenAPI 3.0.4 §4.8.24 (nullable)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, properties: {info: {type: object, properties: {age: {type: integer}}}}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"info\": {\"age\": null}}"
expect:
  valid: false
  kind: schema_violation
  location: body/info/age
