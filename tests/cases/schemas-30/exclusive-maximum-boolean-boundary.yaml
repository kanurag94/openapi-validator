title: "Boolean exclusiveMaximum true makes the maximum itself invalid"
ref: "JSON Schema Validation (Wright draft 00) §5.1.2 exclusiveMaximum; OpenAPI 3.0.4 §4.7.24"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: integer, maximum: 5, exclusiveMaximum: true}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "5"
expect:
  valid: false
  kind: schema_violation
  location: body
