title: "A required writeOnly property is still required in a request"
ref: "OpenAPI 3.0.4 §4.7.24 (readOnly, writeOnly)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, required: [password], properties: {password: {type: string, writeOnly: true}}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{}"
expect:
  valid: false
  kind: schema_violation
  location: body/password
