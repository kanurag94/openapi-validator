title: "not passes when its schema fails"
ref: "JSON Schema Validation (Wright draft 00) §5.5.6 not"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {not: {type: string}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "1"
expect:
  valid: true
