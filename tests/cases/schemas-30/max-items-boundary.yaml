title: "maxItems 2 accepts two elements"
ref: "JSON Schema Validation (Wright draft 00) §5.3.2 maxItems"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: array, items: {}, maxItems: 2}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "[1, 2]"
expect:
  valid: true
