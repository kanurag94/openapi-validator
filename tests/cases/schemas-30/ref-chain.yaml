title: "A chain of $refs resolves to the final schema"
ref: "OpenAPI 3.0.4 §4.7.24 (Reference Object)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/A'}
        responses: {"200": {description: ok}}
  components:
    schemas:
      A: {$ref: '#/components/schemas/B'}
      B: {$ref: '#/components/schemas/C'}
      C: {type: string, maxLength: 3}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"too long\""
expect:
  valid: false
  kind: schema_violation
  location: body
