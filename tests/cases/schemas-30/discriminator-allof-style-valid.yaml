title: "allOf-style discriminator accepts a complete child payload"
ref: "OpenAPI 3.0.4 §4.7.25 (Discriminator Object)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        responses: {"200": {description: ok}}
  components:
    schemas:
      Pet: {type: object, required: [petType], properties: {petType: {type: string}}, discriminator: {propertyName: petType}}
      Cat: {allOf: [{$ref: '#/components/schemas/Pet'}, {type: object, required: [meow], properties: {meow: {type: boolean}}}]}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"petType\": \"Cat\", \"meow\": false}"
expect:
  valid: true
