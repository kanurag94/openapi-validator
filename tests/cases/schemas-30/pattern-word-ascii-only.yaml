title: "\\w does not match an accented letter"
ref: "JSON Schema Validation (Wright draft 00) §5.2.3 pattern (ECMA 262)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, pattern: '^\w+$'}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"café\""
expect:
  valid: false
  kind: schema_violation
  location: body
