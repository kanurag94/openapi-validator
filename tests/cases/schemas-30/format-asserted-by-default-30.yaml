title: In 3.0 formats are asserted by default
ref: OpenAPI 3.0.4 §4.4; RFC 3339 §5.6
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: date-time}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: '"yesterday"'
expect:
  valid: false
  location: body
