title: "A missing nested required property is reported under its parent"
ref: "JSON Schema Validation (Wright draft 00) §5.4.3 required"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, properties: {address: {type: object, required: [zip]}}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"address\": {\"city\": \"x\"}}"
expect:
  valid: false
  kind: schema_violation
  location: body/address/zip
