title: "A bad date inside a property is reported at that property"
ref: "OpenAPI 3.0.4 §4.7.24 (Data Types); RFC 3339 §5.6"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, properties: {born: {type: string, format: date}}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"born\": \"2024-02-30\"}"
expect:
  valid: false
  kind: schema_violation
  location: body/born
