title: "A required readOnly property is still required in a response"
ref: "OpenAPI 3.0.4 §4.8.24 (readOnly, writeOnly)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object, required: [id], properties: {id: {type: integer, readOnly: true}}}
request: {method: GET, path: /t}
response:
  status: 200
  headers: [["Content-Type", "application/json"]]
  body: "{}"
expect:
  valid: false
  kind: schema_violation
  location: body/id
