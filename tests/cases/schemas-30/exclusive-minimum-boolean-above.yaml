title: "Boolean exclusiveMinimum true accepts a value just above the minimum"
ref: "JSON Schema Validation (Wright draft 00) §5.1.3 exclusiveMinimum; OpenAPI 3.0.4 §4.7.24"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: number, minimum: 10, exclusiveMinimum: true}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "10.0001"
expect:
  valid: true
