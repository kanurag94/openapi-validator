title: 'Without the u flag, \A is the letter A (Annex B)'
ref: "JSON Schema Validation (Wright draft 00) §5.3; ECMA-262 Annex B.1.2"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /p:
      get:
        parameters: [{name: a, in: query, schema: {type: string, pattern: '^\A$'}}]
        responses: {'200': {description: ok}}
request: {method: GET, path: /p, query: "a=A"}
expect: {valid: true}
