title: "not fails when its schema passes"
ref: "JSON Schema Validation (Wright draft 00) §5.5.6 not"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {not: {type: string}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"a\""
expect:
  valid: false
  kind: schema_violation
  location: body
