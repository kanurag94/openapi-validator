title: "nullable on the outer schema does not relax the allOf member's type"
ref: "OpenAPI 3.0.4 §4.7.24 (nullable)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, nullable: true, allOf: [{type: string}]}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "null"
expect:
  valid: false
  kind: schema_violation
  location: body
