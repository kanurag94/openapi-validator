title: "A bad element in a nested array is reported at its full pointer"
ref: "JSON Schema Validation (Wright draft 00) §5.3.1 items"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, properties: {items: {type: array, items: {type: integer}}}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"items\": [1, 2, 3, \"x\"]}"
expect:
  valid: false
  kind: schema_violation
  location: body/items/3
