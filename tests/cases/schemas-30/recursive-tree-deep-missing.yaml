title: "A missing required property deep in a recursive tree is reported there"
ref: "OpenAPI 3.0.4 §4.8.24 (Reference Object)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        responses: {"200": {description: ok}}
  components:
    schemas:
      Node: {type: object, required: [value], properties: {value: {type: integer}, children: {type: array, items: {$ref: '#/components/schemas/Node'}}}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"value\": 1, \"children\": [{\"value\": 2}, {\"children\": []}]}"
expect:
  valid: false
  kind: schema_violation
  location: body/children/1/value
