title: "An integer far beyond 2^63 still satisfies type integer when no format bounds it"
ref: "OpenAPI 3.0.4 §4.8.24 (Data Types: integer)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: integer}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "123456789012345678901234567890"
expect:
  valid: true
