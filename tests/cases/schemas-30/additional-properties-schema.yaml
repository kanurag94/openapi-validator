title: "additionalProperties as a schema checks undeclared values"
ref: "JSON Schema Validation (Wright draft 00) §5.4.4 additionalProperties"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, additionalProperties: {type: integer}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"x\": 1, \"y\": \"two\"}"
expect:
  valid: false
  kind: schema_violation
  location: body/y
