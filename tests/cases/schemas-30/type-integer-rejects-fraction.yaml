title: In 3.0, 1.5 is not an integer
ref: OpenAPI 3.0.4 §4.4
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: integer}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: '1.5'
expect:
  valid: false
  kind: schema_violation
  location: body
