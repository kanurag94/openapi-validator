title: "additionalProperties false does not see properties declared in allOf"
ref: "JSON Schema Validation (Wright draft 00) §5.4.4 additionalProperties"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, allOf: [{properties: {a: {type: integer}}}], additionalProperties: false}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"a\": 1}"
expect:
  valid: false
  kind: schema_violation
  location: body/a
