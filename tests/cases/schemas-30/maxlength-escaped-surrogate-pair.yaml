title: "A JSON-escaped surrogate pair is one character"
ref: "JSON Schema Validation (Wright draft 00) §5.2.1 maxLength"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, maxLength: 1}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"\\ud83d\\ude00\""
expect:
  valid: true
