title: "A fully anchored pattern accepts a matching string"
ref: "JSON Schema Validation (Wright draft 00) §5.2.3 pattern"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, pattern: '^[a-z]+$'}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"abc\""
expect:
  valid: true
