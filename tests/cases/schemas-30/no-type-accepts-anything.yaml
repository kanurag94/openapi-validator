title: "A schema with no type accepts an array"
ref: "OpenAPI 3.0.4 §4.7.24"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {description: anything}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "[1, \"a\", null]"
expect:
  valid: true
