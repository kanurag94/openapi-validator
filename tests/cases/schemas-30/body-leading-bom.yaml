title: "One leading byte order mark is accepted"
ref: "RFC 8259 §8.1"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, required: [a]}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\uFEFF{\"a\": 1}"
expect:
  valid: true
