title: "A value below minimum fails"
ref: "JSON Schema Validation (Wright draft 00) §5.1.3 minimum"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: number, minimum: 10}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "9.999"
expect:
  valid: false
  kind: schema_violation
  location: body
