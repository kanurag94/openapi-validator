title: "Duplicate object keys make the body malformed"
ref: "RFC 8259 §4; OpenAPI 3.0.4 §4.7.14 (Media Type Object)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"a\": 1, \"a\": 2}"
expect:
  valid: false
  kind: malformed_body
