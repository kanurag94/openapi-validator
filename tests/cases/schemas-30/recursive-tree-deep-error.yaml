title: "A recursive schema reports a deep error at its full pointer"
ref: "OpenAPI 3.0.4 §4.7.24 (Reference Object)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Node'}
        responses: {"200": {description: ok}}
  components:
    schemas:
      Node: {type: object, required: [value], properties: {value: {type: integer}, children: {type: array, items: {$ref: '#/components/schemas/Node'}}}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"value\": 1, \"children\": [{\"value\": 2, \"children\": [{\"value\": \"x\"}]}]}"
expect:
  valid: false
  kind: schema_violation
  location: body/children/0/children/0/value
