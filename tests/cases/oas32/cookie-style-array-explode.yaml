title: "An exploded cookie-style array repeats the cookie"
ref: "OpenAPI 3.2.0 §4.12.3, Appendix D"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /c:
      get:
        parameters:
          - {name: color, in: cookie, style: cookie, schema: {type: array, maxItems: 2, items: {type: string}}}
        responses:
          "200": {description: ok}
request: {method: GET, path: /c, headers: [["Cookie", "color=blue; color=black; color=brown"]]}
expect: {valid: false, kind: invalid_parameter, location: cookie.color}
