title: "itemSchema checks each line of a JSON Lines body"
ref: "OpenAPI 3.2.0 §4.14.3.1, §4.14.6.2"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /logs:
      post:
        requestBody:
          content:
            application/jsonl:
              itemSchema: {$ref: "#/components/schemas/LogEntry"}
            application/json-seq:
              schema: {$ref: "#/components/schemas/Log"}
        responses:
          "200":
            description: ok
            content:
              application/x-ndjson:
                itemSchema: {$ref: "#/components/schemas/LogEntry"}
  components:
    schemas:
      LogEntry:
        type: object
        properties:
          timestamp: {type: string, format: date-time}
          level: {type: integer, minimum: 0}
          message: {type: string}
      Log:
        type: array
        items: {$ref: "#/components/schemas/LogEntry"}
        maxItems: 2
request: {method: POST, path: /logs, headers: [["Content-Type", "application/jsonl"]], body: "{\"level\": 1, \"message\": \"Hi!\"}\n{\"level\": -1}\n"}
expect: {valid: false, kind: schema_violation, location: body/1/level}
