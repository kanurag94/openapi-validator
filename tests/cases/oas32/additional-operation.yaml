title: "A method from additionalOperations is routed with the capitalization written"
ref: "OpenAPI 3.2.0 §4.9.1"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /search:
      query:
        operationId: search
        requestBody:
          required: true
          content:
            application/json:
              $ref: "#/components/mediaTypes/Filter"
        responses:
          "200": {description: ok}
      additionalOperations:
        LINK:
          operationId: link
          parameters:
            - {name: Link, in: header, required: true, schema: {type: string}}
          responses:
            "204": {description: linked}
        POST:
          operationId: ignoredBecausePostIsAFixedField
          responses:
            "201": {description: created}
      post:
        operationId: create
        responses:
          "200": {description: ok}
  components:
    mediaTypes:
      Filter:
        schema: {type: object, required: [q], properties: {q: {type: string}}}
request: {method: LINK, path: /search, headers: [["Link", "</a>; rel=next"]]}
