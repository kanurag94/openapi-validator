title: "A JSON querystring is percent-decoded and parsed as JSON"
ref: "OpenAPI 3.2.0 §4.12.8; Appendix E"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /find:
      get:
        parameters:
          - name: json
            in: querystring
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    numbers: {type: array, items: {type: integer}}
                    flag: {type: [boolean, "null"]}
        responses:
          "200": {description: ok}
request: {method: GET, path: /find, query: "%7B%22numbers%22%3A%5B1%2C2%5D%2C%22flag%22%3Anull%7D"}
expect: {valid: true}
