title: "By default the discriminator is an annotation, and oneOf alone decides"
ref: "OpenAPI 3.2.0 §4.25"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /pets:
      post:
        requestBody:
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Cat"
                  - $ref: "#/components/schemas/Dog"
                  - $ref: "#/components/schemas/OtherPet"
                discriminator:
                  propertyName: petType
                  mapping:
                    cat: Cat
                    dog: Dog
                  defaultMapping: OtherPet
        responses:
          "201": {description: ok}
  components:
    schemas:
      Cat:
        type: object
        required: [petType, lives]
        properties:
          petType: {const: cat}
          lives: {type: integer}
      Dog:
        type: object
        required: [petType, bark]
        properties:
          petType: {const: dog}
          bark: {type: string}
      OtherPet:
        type: object
        required: [name]
        properties:
          name: {type: string}
          petType:
            not:
              enum: [cat, dog]
request: {method: POST, path: /pets, headers: [["Content-Type", "application/json"]], body: '{"petType": "parrot", "name": "polly"}'}
expect: {valid: true}
