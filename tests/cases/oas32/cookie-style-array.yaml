title: "A non-exploded cookie-style array is comma-separated"
ref: "OpenAPI 3.2.0 §4.12.3, Appendix D"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /c:
      get:
        parameters:
          - {name: color, in: cookie, style: cookie, explode: false, schema: {type: array, maxItems: 3, items: {type: string}}}
        responses:
          "200": {description: ok}
request: {method: GET, path: /c, headers: [["Cookie", "color=blue,black,brown"]]}
expect: {valid: true}
