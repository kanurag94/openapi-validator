title: "A querystring parameter reads the whole query string as form content"
ref: "OpenAPI 3.2.0 §4.12.1, §4.12.8"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /find:
      get:
        parameters:
          - name: q
            in: querystring
            required: true
            content:
              application/x-www-form-urlencoded:
                schema:
                  type: object
                  required: [foo]
                  properties:
                    foo: {type: string}
                    bar: {type: boolean}
                  additionalProperties: false
        responses:
          "200": {description: ok}
request: {method: GET, path: /find, query: "foo=a+%2B+b&bar=true"}
expect: {valid: true}
