title: "An object form field defaults to JSON, percent-decoded with + as space"
ref: "OpenAPI 3.2.0 §4.15.3.1"
document: |
  openapi: 3.2.0
  info: {title: t, version: "1"}
  paths:
    /addr:
      post:
        requestBody:
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  address:
                    type: object
                    required: [zip]
                    properties:
                      zip: {type: string, pattern: "^[0-9]{5}\\+[0-9]{4}$"}
              encoding: {}
        responses:
          "204": {description: ok}
request: {method: POST, path: /addr, headers: [["Content-Type", "application/x-www-form-urlencoded"]], body: "id=f81d4fae-7dec-11d0-a765-00a0c91e6bf6&address=%7B%22streetAddress%22%3A%22123+Example+Dr.%22%2C%22city%22%3A%22Somewhere%22%2C%22state%22%3A%22CA%22%2C%22zip%22%3A%2299999%2B1234%22%7D"}
expect: {valid: true}
