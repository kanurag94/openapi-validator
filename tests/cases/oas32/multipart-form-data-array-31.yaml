title: "Before 3.2, form-data is an object, so an array schema does not match it"
ref: "OpenAPI 3.2.1 §4.14.5.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /f:
      post:
        requestBody:
          content:
            multipart/form-data:
              schema:
                type: array
                prefixItems:
                  - {type: object, required: [first], properties: {first: {type: string}}}
                  - {type: object, required: [second], properties: {second: {type: string}}}
        responses:
          "204": {description: ok}
request: {method: POST, path: /f, headers: [["Content-Type", "multipart/form-data; boundary=b"]], body: "--b\r\nContent-Disposition: form-data; name=\"first\"\r\n\r\n1\r\n--b--\r\n"}
expect: {valid: false, kind: schema_violation}
