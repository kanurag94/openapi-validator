title: "A percent-encoded ampersand stays inside the value"
ref: "OpenAPI 3.1.1 §4.8.14.4, WHATWG URL §5.1, RFC 3986 §2.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  q: {type: string, const: "a&b=c"}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "q=a%26b%3Dc"}
expect: {"valid": true}
