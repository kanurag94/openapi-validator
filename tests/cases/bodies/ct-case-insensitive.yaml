title: "Media type names compare case-insensitively"
ref: "OpenAPI 3.1.1 §4.8.14, RFC 9110 §8.3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "Application/JSON"]], "body": "{\"age\": \"x\"}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/age"}
