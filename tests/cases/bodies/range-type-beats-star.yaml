title: "A type/* key is preferred over */*"
ref: "OpenAPI 3.1.1 §4.8.14 (more specific key takes precedence)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            "*/*": {}
            application/*:
              schema: {type: array}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body"}
