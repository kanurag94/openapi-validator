title: "Mismatched end tags are not well-formed"
ref: "XML 1.0 §3 (Element Type Match), OpenAPI 3.1.1 §4.8.14"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            text/xml:
              schema: {type: object}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "text/xml"]], "body": "<a><b></a></b>"}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
