title: "In a form body + is a space, so it delimits spaceDelimited"
ref: "OpenAPI 3.1.1 §4.8.12.4, WHATWG URL §5.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  tags: {type: array, items: {type: integer}, maxItems: 2}
              encoding:
                tags: {style: spaceDelimited, explode: false}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "tags=1+2+3"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/tags"}
