title: "A text body of digits can meet an integer schema"
ref: "OpenAPI 3.1.1 §4.8.14"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            text/plain:
              schema: {type: integer, minimum: 1}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "text/plain"]], "body": "5"}
expect: {"valid": true}
