title: "Field names are percent-decoded too"
ref: "WHATWG URL §5.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                additionalProperties: false
                properties:
                  first name: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "first%20name=x"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/first name"}
