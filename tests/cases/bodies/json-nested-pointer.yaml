title: "A violation inside a nested array is located by JSON pointer"
ref: "OpenAPI 3.1.1 §4.8.14 (schema), RFC 6901"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags: {type: array, items: {type: string}}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/json"]], "body": "{\"tags\": [\"a\", 2]}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/tags/1"}
