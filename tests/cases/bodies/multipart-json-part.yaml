title: "A part labelled application/json is parsed as JSON"
ref: "OpenAPI 3.1.1 §4.8.15.5, RFC 7578 §4, RFC 7578 §4.4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  meta: {type: object, properties: {n: {type: integer}}}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "multipart/form-data; boundary=B"]], "body": "--B\r\nContent-Disposition: form-data; name=\"meta\"\r\nContent-Type: application/json\r\n\r\n{\"n\": 1}\r\n--B--\r\n"}
expect: {"valid": true}
