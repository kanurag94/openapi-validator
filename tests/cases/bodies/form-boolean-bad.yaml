title: "Boolean form fields reject other words"
ref: "OpenAPI 3.1.1 §4.8.14.4, WHATWG URL §5.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  flag: {type: boolean}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "flag=yes"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/flag"}
