title: "A text part that is not an integer fails"
ref: "OpenAPI 3.1.1 §4.8.15.5, RFC 7578 §4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  id: {type: integer}
                  note: {type: string}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "multipart/form-data; boundary=B"]], "body": "--B\r\nContent-Disposition: form-data; name=\"id\"\r\n\r\nx\r\n--B--\r\n"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/id"}
