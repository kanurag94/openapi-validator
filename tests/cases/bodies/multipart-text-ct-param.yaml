title: "A text part with its own Content-Type is still text"
ref: "OpenAPI 3.1.1 §4.8.14.5, RFC 7578 §4, RFC 7578 §4.4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  note: {type: string, maxLength: 2}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "multipart/form-data; boundary=B"]], "body": "--B\r\nContent-Disposition: form-data; name=\"note\"\r\nContent-Type: text/plain; charset=utf-8\r\n\r\nabc\r\n--B--\r\n"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/note"}
