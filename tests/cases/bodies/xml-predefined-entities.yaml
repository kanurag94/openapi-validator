title: "A well-formed XML body is checked against its schema through the XML Object"
ref: "OpenAPI 3.1.1 §4.8.26 (XML Object); XML 1.0 §2.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/xml:
              schema: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/xml"]], "body": "<a>&lt;x&gt; &amp; &#65;</a>"}
expect: {"valid": false, "kind": "schema_violation", "location": "body"}
