title: "A body with no Content-Type is not checked against the single declared type"
ref: "OpenAPI 3.1.1 §4.8.13"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "body": "{\"age\": \"old\"}"}
expect: {"valid": true}
