title: "Undeclared form fields are object properties"
ref: "OpenAPI 3.1.1 §4.8.14.4, WHATWG URL §5.1, JSON Schema Core §10.3.2.3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                additionalProperties: false
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "name=a&color=red"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/color"}
