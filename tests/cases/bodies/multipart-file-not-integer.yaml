title: "A file part is a string, so it cannot meet an integer schema"
ref: "OpenAPI 3.1.1 §4.8.15.5, RFC 7578 §4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  upload: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "multipart/form-data; boundary=B"]], "body": "--B\r\nContent-Disposition: form-data; name=\"upload\"; filename=\"n.txt\"\r\n\r\n12\r\n--B--\r\n"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/upload"}
