title: "A form body with a charset parameter still matches"
ref: "OpenAPI 3.1.1 §4.8.14, RFC 9110 §8.3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded; charset=UTF-8"]], "body": "age=x"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/age"}
