title: "Duplicate object member names are rejected"
ref: "RFC 8259 §4, OpenAPI 3.1.1 §4.8.14"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/json"]], "body": "{\"age\": 1, \"age\": 2}"}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
