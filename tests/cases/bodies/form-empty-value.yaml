title: "An empty value is the empty string"
ref: "WHATWG URL §5.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  name: {type: string, minLength: 1}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "name="}
expect: {"valid": false, "kind": "schema_violation", "location": "body/name"}
