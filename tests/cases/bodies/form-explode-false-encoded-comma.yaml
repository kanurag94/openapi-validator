title: "A percent-encoded comma also delimits"
ref: "OpenAPI 3.1.1 §4.8.12.4, §4.8.15.4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  tags: {type: array, minItems: 2, items: {type: string}}
              encoding:
                tags: {explode: false}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "tags=a%2Cb"}
expect: {"valid": true}
