title: "A type/* key covers any subtype of that type"
ref: "OpenAPI 3.1.1 §4.8.14 (media type ranges), RFC 9110 §12.5.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            text/*:
              schema: {type: string, maxLength: 3}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "text/csv"]], "body": "a,b,c,d"}
expect: {"valid": false, "kind": "schema_violation", "location": "body"}
