title: "application/json does not match a declared application/xml"
ref: "OpenAPI 3.1.1 §4.8.14"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/xml:
              schema: {type: object}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "unsupported_media_type", "location": "header.content-type"}
