title: "A file part is a string and meets a binary string schema"
ref: "OpenAPI 3.1.1 §4.8.15.5, RFC 7578 §4, RFC 7578 §4.2 (filename)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  upload: {type: string, format: binary}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "multipart/form-data; boundary=B"]], "body": "--B\r\nContent-Disposition: form-data; name=\"upload\"; filename=\"a.bin\"\r\nContent-Type: application/octet-stream\r\n\r\n\u0001\u0002raw\r\n--B--\r\n"}
expect: {"valid": true}
