title: "The form-data disposition type is case-insensitive"
ref: "RFC 7578 §4.2, RFC 6266 §4.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  id: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "multipart/form-data; boundary=B"]], "body": "--B\r\nContent-Disposition: Form-Data; name=\"id\"\r\n\r\nx\r\n--B--\r\n"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/id"}
