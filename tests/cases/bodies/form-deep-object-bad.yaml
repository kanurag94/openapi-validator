title: "deepObject values are coerced by property schemas"
ref: "OpenAPI 3.1.1 §4.8.15.1, §4.8.12.4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  filter: {type: object, properties: {color: {type: string}, size: {type: integer}}}
              encoding:
                filter: {style: deepObject, explode: true}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "filter%5Bcolor%5D=red&filter%5Bsize%5D=big"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/filter/size"}
