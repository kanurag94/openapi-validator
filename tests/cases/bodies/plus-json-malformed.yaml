title: "A +json body matched through a range must still be well-formed JSON"
ref: "OpenAPI 3.1.1 §4.8.14, RFC 6839 §3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/*:
              schema: {type: object}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/problem+json"]], "body": "{\"title\": "}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
