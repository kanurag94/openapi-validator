title: "An encoding contentType of application/json parses the part as JSON"
ref: "OpenAPI 3.1.1 §4.8.15.1 (contentType), OpenAPI 3.1.1 §4.8.14.5, RFC 7578 §4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            multipart/form-data:
              schema:
                type: object
                properties:
                  meta: {}
              encoding:
                meta: {contentType: application/json}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "multipart/form-data; boundary=B"]], "body": "--B\r\nContent-Disposition: form-data; name=\"meta\"\r\n\r\n[1, \r\n--B--\r\n"}
expect: {"valid": false, "kind": "malformed_body"}
