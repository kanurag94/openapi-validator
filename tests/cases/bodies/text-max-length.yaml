title: "A text/plain body is checked as a string"
ref: "OpenAPI 3.1.1 §4.8.14"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            text/plain:
              schema: {type: string, maxLength: 3}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "text/plain"]], "body": "abcd"}
expect: {"valid": false, "kind": "schema_violation", "location": "body"}
