title: "An optional body that is sent is still validated"
ref: "OpenAPI 3.1.1 §4.8.13"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: false
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/json"]], "body": "{\"age\": []}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/age"}
