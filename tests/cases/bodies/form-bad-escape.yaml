title: "An invalid percent escape is malformed"
ref: "OpenAPI 3.1.1 §4.8.15.4, WHATWG URL §5.1, RFC 3986 §2.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "name=%zz"}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
