title: "3.0 documents use the same form rules"
ref: "OpenAPI 3.0.4 §4.8.15.4"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "name=a&age=1.5"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/age"}
