title: "With no Content-Type and two declared types the body type is unknown"
ref: "OpenAPI 3.1.1 §4.8.13, RFC 9110 §8.3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}

            application/xml:
              schema: {type: object}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "body": "{}"}
expect: {"valid": false, "kind": "unsupported_media_type", "location": "header.content-type"}
