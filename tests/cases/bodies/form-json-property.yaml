title: "An encoding contentType of application/json parses the field as JSON"
ref: "OpenAPI 3.1.1 §4.8.15.1 (contentType), §4.8.14.4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                properties:
                  meta: {type: object, properties: {n: {type: integer}}}
              encoding:
                meta: {contentType: application/json}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "meta=%7B%22n%22%3A%201%7D"}
expect: {"valid": true}
