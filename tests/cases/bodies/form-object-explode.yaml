title: "An object property with form/explode true takes its fields as pairs"
ref: "OpenAPI 3.1.1 §4.8.15.1, §4.8.12.4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/x-www-form-urlencoded:
              schema:
                type: object
                required: [point]
                properties:
                  point: {type: object, properties: {x: {type: integer}, y: {type: integer}}, required: [x, y]}
              encoding:
                point: {style: form, explode: true}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/x-www-form-urlencoded"]], "body": "x=1&y=2"}
