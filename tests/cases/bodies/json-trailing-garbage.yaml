title: "Text after the JSON value is malformed"
ref: "RFC 8259 §2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
                  age: {type: integer}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/json"]], "body": "{} {}"}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
