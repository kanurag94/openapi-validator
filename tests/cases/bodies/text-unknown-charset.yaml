title: "A charset that cannot be decoded is malformed"
ref: "OpenAPI 3.1.1 §4.8.14, RFC 2046 §4.1.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            text/plain:
              schema: {type: string, maxLength: 3}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "text/plain; charset=utf-16"]], "body": "ab"}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
