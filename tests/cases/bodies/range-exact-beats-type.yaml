title: "An exact key is preferred over type/* whatever the order"
ref: "OpenAPI 3.1.1 §4.8.14 (more specific key takes precedence)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/*:
              schema: {type: object}
            application/json:
              schema: {type: array}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/json"]], "body": "[]"}
expect: {"valid": true}
