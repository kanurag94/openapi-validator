title: "A +xml suffix is checked for well-formedness"
ref: "OpenAPI 3.1.1 §4.8.14, RFC 6839 §4.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/atom+xml:
              schema: {type: object}
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/atom+xml"]], "body": "<feed><entry></feed>"}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
