title: "A +json structured syntax suffix is parsed as JSON"
ref: "OpenAPI 3.1.1 §4.8.14, RFC 6839 §3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/vnd.acme.pet+json:
              schema:
                type: object
                required: [id]
        responses: {"200": {description: ok}}
request: {"method": "POST", "path": "/x", "headers": [["Content-Type", "application/vnd.acme.pet+json"]], "body": "{\"name\": \"x\"}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/id"}
