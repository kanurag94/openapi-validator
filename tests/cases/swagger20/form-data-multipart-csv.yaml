title: "A csv formData array in a multipart body is split on commas"
ref: "Swagger 2.0 §5.2.11"
document: |
  swagger: "2.0"
  info: {title: t, version: "1"}
  paths:
    /up:
      post:
        consumes: [multipart/form-data]
        parameters:
          - {name: ids, in: formData, type: array, items: {type: integer}, maxItems: 2}
        responses:
          "204": {description: ok}
request: {method: POST, path: /up, headers: [["Content-Type", "multipart/form-data; boundary=b"]], body: "--b\r\nContent-Disposition: form-data; name=\"ids\"\r\n\r\n1,2\r\n--b--\r\n"}
expect: {valid: true}
