title: "A tsv array, which no 3.0 style splits, is read as one string"
ref: "Swagger 2.0 §5.2.11"
document: |
  swagger: "2.0"
  info: {title: t, version: "1"}
  produces: [application/json]
  paths:
    /things:
      get:
        responses:
          "200": {description: ok, schema: {$ref: "#/definitions/Thing"}}
          default: {$ref: "#/responses/Error"}
      post:
        produces: [application/xml]
        parameters:
          - {name: tags, in: query, type: array, items: {type: integer}, collectionFormat: tsv}
        responses:
          "201": {description: created}
          "404": {$ref: "#/responses/NotFound"}
  responses:
    Error: {description: error, schema: {$ref: "#/definitions/Error"}}
    NotFound: {description: not found, schema: {type: string}}
  definitions:
    Thing:
      type: object
      properties:
        default: {$ref: "#/definitions/Error"}
    Error: {type: object, required: [code], properties: {code: {type: integer}}}
request: {method: POST, path: /things, query: "tags=1%092"}
expect: {valid: true}
