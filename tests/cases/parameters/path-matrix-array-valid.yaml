title: "A non-exploded matrix array is ;name= then comma-separated items"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) matrix array"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/c/{color}":
      get:
        parameters:
          - {"name": "color", "in": "path", "required": true, "schema": {"type": "array", "items": {"type": "string", "enum": ["blue", "black", "brown"]}}, "style": "matrix"}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/c/;color=blue,black,brown"
expect:
  valid: true
