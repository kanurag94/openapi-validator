title: "An exploded form array repeats name=item"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) form* array"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "array", "items": {"type": "string", "enum": ["blue", "black", "brown"]}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color=blue&color=black&color=brown"
expect:
  valid: true
