title: "A deepObject uses name[key]=value pairs"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) deepObject"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}}, "style": "deepObject", "explode": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color[R]=100&color[G]=200&color[B]=150"
expect:
  valid: true
