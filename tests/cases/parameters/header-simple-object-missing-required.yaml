title: "A header object lacking a required property is refused"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) simple object"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/h":
      get:
        parameters:
          - {"name": "X-Color", "in": "header", "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}, "required": ["R", "G", "B"]}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/h"
  headers: [["X-Color", "R,1,G,2"]]
expect:
  valid: false
  kind: invalid_parameter
