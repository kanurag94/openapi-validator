title: "Empty pairs between ampersands are skipped"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: query); RFC 3986 §3.4"
options: {"allow_unknown_query": false}
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "q", "in": "query", "schema": {"type": "string"}, "required": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "&&q=a&&"
expect:
  valid: true
