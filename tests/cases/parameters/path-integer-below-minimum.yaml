title: "A path integer below minimum is refused"
ref: "OpenAPI 3.1.1 §4.8.12.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/items/{id}":
      get:
        parameters:
          - {"name": "id", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/items/0"
expect:
  valid: false
  kind: invalid_parameter
  location: path.id
