title: "An encoded equals sign is part of the value"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: query); RFC 3986 §3.4; RFC 3986 §2.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "q", "in": "query", "schema": {"type": "string", "enum": ["a=b"]}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "q=a%3Db"
expect:
  valid: true
