title: "A cookie described by JSON content must hold JSON"
ref: "OpenAPI 3.1.1 §4.8.12.2.3 (fixed fields for use with content)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/k":
      get:
        parameters:
          - {"name": "prefs", "in": "cookie", "content": {"application/json": {"schema": {"type": "object"}}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/k"
  headers: [["Cookie", "prefs=%5B1%5D"]]
expect:
  valid: false
  kind: invalid_parameter
  location: cookie.prefs
