title: "A header array under 3.0.4 is comma-separated"
ref: "OpenAPI 3.0.4 §4.8.12.4 (style examples) simple array"
document: |
  openapi: 3.0.4
  info: {title: t, version: "1"}
  paths:
    "/h":
      get:
        parameters:
          - {"name": "X-Ids", "in": "header", "schema": {"type": "array", "items": {"type": "integer"}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/h"
  headers: [["X-Ids", "1,2"]]
expect:
  valid: true
