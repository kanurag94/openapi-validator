title: "Commas do not separate pipeDelimited items"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) pipeDelimited array"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "ids", "in": "query", "schema": {"type": "array", "items": {"type": "integer"}}, "style": "pipeDelimited", "explode": false}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "ids=1,2|3"
expect:
  valid: false
  kind: invalid_parameter
  location: query.ids/0
