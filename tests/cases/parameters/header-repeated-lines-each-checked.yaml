title: "Each line of a repeated header is checked"
ref: "OpenAPI 3.1.1 §4.8.12.2; RFC 9110 §5.3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/h":
      get:
        parameters:
          - {"name": "X-Count", "in": "header", "schema": {"type": "integer"}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/h"
  headers: [["X-Count", "1"], ["X-Count", "x"]]
expect:
  valid: false
  kind: invalid_parameter
