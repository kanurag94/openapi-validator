title: "A non-exploded cookie object is keys and values separated by commas"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) form object (cookie)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/k":
      get:
        parameters:
          - {"name": "color", "in": "cookie", "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}, "required": ["R", "G", "B"]}, "explode": false}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/k"
  headers: [["Cookie", "color=R,100,G,200,B,150"]]
expect:
  valid: true
