title: "A query number may use an exponent"
ref: "OpenAPI 3.1.1 §4.8.12.2; RFC 8259 §6"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "x", "in": "query", "schema": {"type": "number", "maximum": 5000}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "x=1e3"
expect:
  valid: true
