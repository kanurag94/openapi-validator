title: "Text that is not a number fails an integer path parameter"
ref: "OpenAPI 3.1.1 §4.8.12.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/items/{id}":
      get:
        parameters:
          - {"name": "id", "in": "path", "required": true, "schema": {"type": "integer"}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/items/abc"
expect:
  valid: false
  kind: invalid_parameter
  location: path.id
