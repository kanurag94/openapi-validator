title: "A required query parameter that is absent is reported missing"
ref: "OpenAPI 3.1.1 §4.8.12.2.1 required"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "limit", "in": "query", "schema": {"type": "integer"}, "required": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
expect:
  valid: false
  kind: missing_parameter
  location: query.limit
