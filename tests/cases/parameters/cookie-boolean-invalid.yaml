title: "A cookie boolean must be true or false"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: cookie); RFC 6265 §4.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/k":
      get:
        parameters:
          - {"name": "on", "in": "cookie", "schema": {"type": "boolean"}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/k"
  headers: [["Cookie", "on=yes"]]
expect:
  valid: false
  kind: invalid_parameter
  location: cookie.on
