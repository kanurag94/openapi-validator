title: "A deepObject property of the wrong type is refused under 3.0.4"
ref: "OpenAPI 3.0.4 §4.7.12.4 (style examples) deepObject"
document: |
  openapi: 3.0.4
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}}, "style": "deepObject", "explode": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color[B]=b"
expect:
  valid: false
  kind: invalid_parameter
  location: query.color/B
