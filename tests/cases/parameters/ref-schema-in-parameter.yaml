title: "A parameter schema given by $ref is applied"
ref: "OpenAPI 3.1.1 §4.8.12.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "id", "in": "query", "schema": {"$ref": "#/components/schemas/Id"}}
        responses: {"200": {description: ok}}
  components: {"schemas": {"Id": {"type": "integer", "minimum": 0}}}
request:
  method: GET
  path: "/q"
  query: "id=-1"
expect:
  valid: false
  kind: invalid_parameter
  location: query.id
