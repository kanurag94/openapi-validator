title: "A non-exploded matrix object property of the wrong type is reported"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) matrix object"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/c/{color}":
      get:
        parameters:
          - {"name": "color", "in": "path", "required": true, "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}}, "style": "matrix"}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/c/;color=R,1,G,2,B,z"
expect:
  valid: false
  kind: invalid_parameter
  location: path.color/B
