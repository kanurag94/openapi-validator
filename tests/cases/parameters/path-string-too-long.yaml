title: "A path string longer than maxLength is refused"
ref: "OpenAPI 3.1.1 §4.8.12.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/f/{name}":
      get:
        parameters:
          - {"name": "name", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 3}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/f/abcd"
expect:
  valid: false
  kind: invalid_parameter
  location: path.name
