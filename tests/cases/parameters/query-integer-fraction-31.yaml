title: "Under 3.1 a query integer written 1.0 is accepted"
ref: "OpenAPI 3.1.1 §4.8.12.2; JSON Schema 2020-12 validation §6.1.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "limit", "in": "query", "schema": {"type": "integer"}}
        responses: {"200": {description: ok}}
