title: "A spaceDelimited object separates keys and values with %20"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) spaceDelimited object"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}}, "style": "spaceDelimited", "explode": false}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color=R%20100%20G%20200%20B%20150"
expect:
  valid: true
