title: "A non-exploded form object property of the wrong type is reported"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) form object"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}}, "explode": false}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color=R,100,G,200,B,x"
expect:
  valid: false
  kind: invalid_parameter
  location: query.color/B
