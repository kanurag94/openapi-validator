title: "A text/plain content parameter is checked as a string"
ref: "OpenAPI 3.1.1 §4.8.12.2.3 (fixed fields for use with content)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "s", "in": "query", "content": {"text/plain": {"schema": {"type": "string", "maxLength": 1}}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "s=%7B"
expect:
  valid: true
