title: "Empty brackets in a deepObject append to an array property"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) deepObject"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "f", "in": "query", "schema": {"type": "object", "properties": {"tags": {"type": "array", "maxItems": 1, "items": {"type": "string"}}}}, "style": "deepObject", "explode": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "f[tags][]=a&f[tags][]=b"
expect:
  valid: false
  kind: invalid_parameter
  location: query.f/tags
