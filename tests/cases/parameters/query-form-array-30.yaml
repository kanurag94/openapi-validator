title: "An exploded form array works the same under 3.0.4"
ref: "OpenAPI 3.0.4 §4.7.12.4 (style examples) form* array"
document: |
  openapi: 3.0.4
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "ids", "in": "query", "schema": {"type": "array", "items": {"type": "integer"}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "ids=1&ids=2"
expect:
  valid: true
