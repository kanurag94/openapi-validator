title: "A header parameter named Authorization is ignored"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: header)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/h":
      get:
        parameters:
          - {"name": "authorization", "in": "header", "schema": {"type": "integer"}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/h"
  headers: [["Authorization", "Bearer abc"]]
expect:
  valid: true
