title: "A query number above maximum is refused"
ref: "OpenAPI 3.1.1 §4.8.12.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "x", "in": "query", "schema": {"type": "number", "maximum": 10}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "x=10.5"
expect:
  valid: false
  kind: invalid_parameter
  location: query.x
