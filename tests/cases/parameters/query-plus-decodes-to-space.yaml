title: "A plus sign in a query value decodes to a space by default"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: query); RFC 3986 §3.4; HTML URL-encoded form"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "q", "in": "query", "schema": {"type": "string", "enum": ["a b"]}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "q=a+b"
expect:
  valid: true
