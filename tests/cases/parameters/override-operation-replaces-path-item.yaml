title: "An operation parameter replaces the path-item one with the same name and location"
ref: "OpenAPI 3.1.1 §4.8.9.1 (path item parameters) and §4.8.10.1 (operation parameters)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      parameters:
        - {"name": "v", "in": "query", "schema": {"type": "integer"}}
      get:
        parameters:
          - {"name": "v", "in": "query", "schema": {"type": "string"}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "v=abc"
expect:
  valid: true
