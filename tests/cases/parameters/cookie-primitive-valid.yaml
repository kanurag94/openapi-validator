title: "A cookie parameter is read from the Cookie header"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: cookie); RFC 6265 §4.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/k":
      get:
        parameters:
          - {"name": "sid", "in": "cookie", "schema": {"type": "string", "minLength": 3}, "required": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/k"
  headers: [["Cookie", "sid=abc"]]
expect:
  valid: true
