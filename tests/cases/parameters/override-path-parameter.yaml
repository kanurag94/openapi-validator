title: "An operation path parameter replaces the path-item one"
ref: "OpenAPI 3.1.1 §4.8.9.1 (path item parameters) and §4.8.10.1 (operation parameters)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/items/{id}":
      parameters:
        - {"name": "id", "in": "path", "required": true, "schema": {"type": "integer"}}
      get:
        parameters:
          - {"name": "id", "in": "path", "required": true, "schema": {"type": "string"}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/items/abc"
expect:
  valid: true
