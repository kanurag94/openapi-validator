title: "A path JSON content value that is not JSON is refused"
ref: "OpenAPI 3.1.1 §4.8.12.2.3 (fixed fields for use with content)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/items/{id}":
      get:
        parameters:
          - {"name": "id", "in": "path", "required": true, "content": {"application/json": {"schema": {"type": "integer"}}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/items/abc"
expect:
  valid: false
  kind: invalid_parameter
  location: path.id
