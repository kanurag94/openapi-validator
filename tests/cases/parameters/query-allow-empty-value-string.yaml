title: "An empty value is accepted when the schema allows it"
ref: "OpenAPI 3.1.1 §4.8.12.2.1 allowEmptyValue"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "string"}, "allowEmptyValue": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color="
expect:
  valid: true
