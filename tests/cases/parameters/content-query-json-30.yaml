title: "A JSON content query parameter is parsed as JSON under 3.0.4"
ref: "OpenAPI 3.0.4 §4.7.12.2.3"
document: |
  openapi: 3.0.4
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "filter", "in": "query", "content": {"application/json": {"schema": {"type": "object", "required": ["a"], "properties": {"a": {"type": "integer"}}}}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "filter=%7B%22a%22%3A1.5%7D"
expect:
  valid: false
  kind: invalid_parameter
  location: query.filter/a
