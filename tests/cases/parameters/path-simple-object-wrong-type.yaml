title: "A simple path object property of the wrong type is reported at the property"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) simple object"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/c/{color}":
      get:
        parameters:
          - {"name": "color", "in": "path", "required": true, "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/c/R,100,G,abc,B,150"
expect:
  valid: false
  kind: invalid_parameter
  location: path.color/G
