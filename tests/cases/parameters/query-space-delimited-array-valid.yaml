title: "A spaceDelimited array separates items with %20"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) spaceDelimited array"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "array", "items": {"type": "string", "enum": ["blue", "black", "brown"]}}, "style": "spaceDelimited", "explode": false}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color=blue%20black%20brown"
expect:
  valid: true
