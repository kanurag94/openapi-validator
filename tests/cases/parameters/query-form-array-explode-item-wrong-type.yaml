title: "An exploded form array item of the wrong type is reported at its index"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) form* array"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "ids", "in": "query", "schema": {"type": "array", "items": {"type": "integer"}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "ids=1&ids=x"
expect:
  valid: false
  kind: invalid_parameter
  location: query.ids/1
