title: "An exploded header array is also comma-separated"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) simple* array"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/h":
      get:
        parameters:
          - {"name": "X-Ids", "in": "header", "schema": {"type": "array", "items": {"type": "integer"}}, "explode": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/h"
  headers: [["X-Ids", "1,2,3"]]
expect:
  valid: true
