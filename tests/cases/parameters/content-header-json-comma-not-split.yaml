title: "A JSON content header is not split on commas"
ref: "OpenAPI 3.1.1 §4.8.12.2.3 (fixed fields for use with content)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/h":
      get:
        parameters:
          - {"name": "X-Meta", "in": "header", "content": {"application/json": {"schema": {"type": "array", "items": {"type": "integer"}, "maxItems": 2}}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/h"
  headers: [["X-Meta", "[1,2]"]]
expect:
  valid: true
