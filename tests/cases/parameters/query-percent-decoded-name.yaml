title: "Query names are percent-decoded before matching"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: query); RFC 3986 §3.4; RFC 3986 §2.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "foo", "in": "query", "schema": {"type": "integer"}, "required": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "f%6Fo=1"
expect:
  valid: true
