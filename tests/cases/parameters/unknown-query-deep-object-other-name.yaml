title: "A bracketed name of another parameter is unknown"
ref: "OpenAPI 3.1.1 §4.8.12.1 (parameter locations); §4.8.12.4 (style examples) deepObject"
options: {"allow_unknown_query": false}
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "f", "in": "query", "schema": {"type": "object"}, "style": "deepObject", "explode": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "g[x]=1"
expect:
  valid: false
  kind: unknown_parameter
