title: "A scalar header sent on two lines is one comma-joined value"
ref: "RFC 9110 §5.3; OpenAPI 3.1.1 §4.8.12.4"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /p:
      get:
        parameters: [{name: X-N, in: header, schema: {type: integer}}]
        responses: {'200': {description: ok}}
request: {method: GET, path: /p, headers: [["X-N","1"],["X-N","2"]]}
expect: {valid: false}
