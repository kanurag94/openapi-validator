title: "An exploded matrix array works the same under 3.0.4"
ref: "OpenAPI 3.0.4 §4.7.12.4 (style examples) matrix* array"
document: |
  openapi: 3.0.4
  info: {title: t, version: "1"}
  paths:
    "/items/{id}":
      get:
        parameters:
          - {"name": "id", "in": "path", "required": true, "schema": {"type": "array", "items": {"type": "integer"}}, "style": "matrix", "explode": true}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/items/;id=3;id=4"
expect:
  valid: true
