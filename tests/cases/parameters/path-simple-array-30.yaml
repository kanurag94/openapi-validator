title: "A simple path array is comma-separated under 3.0 as well"
ref: "OpenAPI 3.0.4 §4.7.12.4 (style examples) simple array"
document: |
  openapi: 3.0.4
  info: {title: t, version: "1"}
  paths:
    "/items/{id}":
      get:
        parameters:
          - {"name": "id", "in": "path", "required": true, "schema": {"type": "array", "items": {"type": "integer"}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/items/3,4,5"
expect:
  valid: true
