title: "A text/plain content parameter longer than maxLength is refused"
ref: "OpenAPI 3.1.1 §4.8.12.2.3 (fixed fields for use with content)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "s", "in": "query", "content": {"text/plain": {"schema": {"type": "string", "maxLength": 3}}}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "s=abcd"
expect:
  valid: false
  kind: invalid_parameter
  location: query.s
