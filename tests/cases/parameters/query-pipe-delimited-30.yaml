  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "ids", "in": "query", "schema": {"type": "array", "items": {"type": "integer"}, "maxItems": 1}, "style": "pipeDelimited", "explode": false}
