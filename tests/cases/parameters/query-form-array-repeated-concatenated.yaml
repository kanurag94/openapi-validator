title: "A non-exploded array sent in several pairs is concatenated"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) form array"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "ids", "in": "query", "schema": {"type": "array", "items": {"type": "integer"}, "maxItems": 2}, "explode": false}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "ids=1,2&ids=3"
expect:
  valid: false
  kind: invalid_parameter
  location: query.ids
