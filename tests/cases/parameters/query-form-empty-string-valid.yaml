title: "A form empty value name= is the empty string"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) form empty"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "string"}}
        responses: {"200": {description: ok}}
request:
