title: "A header string not matching its pattern is refused"
ref: "OpenAPI 3.1.1 §4.8.12.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/h":
      get:
        parameters:
          - {"name": "X-Trace", "in": "header", "schema": {"type": "string", "pattern": "^[0-9a-f]{4}$"}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/h"
  headers: [["X-Trace", "zzzz"]]
expect:
  valid: false
  kind: invalid_parameter
  location: header.x-trace
