title: "A matrix object lacking a required property is refused"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) matrix object"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/c/{color}":
      get:
        parameters:
          - {"name": "color", "in": "path", "required": true, "schema": {"type": "object", "properties": {"R": {"type": "integer"}, "G": {"type": "integer"}, "B": {"type": "integer"}}, "required": ["R", "G", "B"]}, "style": "matrix"}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/c/;color=R,100,B,150"
expect:
  valid: false
  kind: invalid_parameter
