title: "Each undeclared query name is reported"
ref: "OpenAPI 3.1.1 §4.8.12.1 (parameter locations)"
options: {"allow_unknown_query": false}
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "x=1&y=2"
expect:
  valid: false
  kind: unknown_parameter
  location: query.y
