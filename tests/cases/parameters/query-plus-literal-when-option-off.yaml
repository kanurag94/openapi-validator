title: "With query_plus_as_space off a plus stays a plus"
ref: "OpenAPI 3.1.1 §4.8.12.2 (in: query); RFC 3986 §3.4"
options: {"query_plus_as_space": false}
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "q", "in": "query", "schema": {"type": "string", "enum": ["a b"]}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "q=a+b"
expect:
  valid: false
  kind: invalid_parameter
  location: query.q
