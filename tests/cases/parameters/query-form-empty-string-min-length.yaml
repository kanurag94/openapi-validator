title: "An empty query value is still checked against minLength"
ref: "OpenAPI 3.1.1 §4.8.12.4 (style examples) form empty; §4.8.12.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    "/q":
      get:
        parameters:
          - {"name": "color", "in": "query", "schema": {"type": "string", "minLength": 1}}
        responses: {"200": {description: ok}}
request:
  method: GET
  path: "/q"
  query: "color="
expect:
  valid: false
  kind: invalid_parameter
  location: query.color
