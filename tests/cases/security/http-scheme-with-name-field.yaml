title: "An http scheme with a stray name field still loads and is checked"
ref: "OpenAPI 3.1.1 §4.8.27.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  security: [{h: []}]
  paths:
    /p:
      get: {responses: {'200': {description: ok}}}
  components:
    securitySchemes:
      h: {type: http, scheme: bearer, name: Authorization}
request: {method: GET, path: /p, headers: [["Authorization","Bearer t"]]}
expect: {valid: true}
