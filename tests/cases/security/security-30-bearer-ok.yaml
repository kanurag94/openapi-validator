title: "A 3.0 http bearer scheme accepts a bearer token"
ref: "OpenAPI 3.0.4 §4.7.27 (Security Scheme Object)"
document: |
  openapi: 3.0.3
  info: {title: t, version: "1"}
  components:
    securitySchemes:
      hkey: {type: apiKey, in: header, name: X-Api-Key}
      qkey: {type: apiKey, in: query, name: api_key}
      ckey: {type: apiKey, in: cookie, name: session}
      basic: {type: http, scheme: basic}
      bearer: {type: http, scheme: bearer, bearerFormat: JWT}
      digest: {type: http, scheme: digest}
      oauth:
        type: oauth2
        flows:
          clientCredentials: {tokenUrl: 'https://auth.example.com/token', scopes: {read: r, write: w}}
      oidc: {type: openIdConnect, openIdConnectUrl: 'https://auth.example.com/.well-known/openid-configuration'}
  security: [{bearer: []}]
  paths:
    /pets: {get: {responses: {"200": {description: ok}}}}
request:
  method: "GET"
  path: "/pets"
  headers: [["Authorization", "Bearer x"]]
expect:
  valid: true
