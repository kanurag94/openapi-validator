title: "A JSON-looking value is not parsed for a schema-based header"
ref: "OpenAPI 3.1.1 §4.8.21, OpenAPI 3.1.1 §4.8.12.4 (simple)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              X-Note:
                schema: {type: string, const: "[1]"}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["X-Note", "[1]"]]}
expect: {"valid": true}
