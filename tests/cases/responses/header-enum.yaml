title: "A header outside its enum fails"
ref: "OpenAPI 3.1.1 §4.8.21"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              X-Tier:
                schema: {type: string, enum: [gold, silver]}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["X-Tier", "bronze"]]}
expect: {"valid": false, "kind": "invalid_parameter", "location": "header.x-tier"}
