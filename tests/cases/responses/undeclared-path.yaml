title: "A response for a path with no operation is undeclared"
ref: "OpenAPI 3.1.1 §4.8.8"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/nowhere"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "undeclared_operation", "location": "request"}
