title: "A header with content application/json is parsed as JSON"
ref: "OpenAPI 3.1.1 §4.8.21 (content)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              X-Meta:
                content:
                  application/json:
                    schema: {type: object, properties: {n: {type: integer}}}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["X-Meta", "{\"n\": 2}"]]}
expect: {"valid": true}
