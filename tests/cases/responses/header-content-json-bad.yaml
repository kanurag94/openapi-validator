title: "A JSON header value is checked against its schema"
ref: "OpenAPI 3.1.1 §4.8.21 (content)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              X-Meta:
                content:
                  application/json:
                    schema: {type: object, properties: {n: {type: integer}}}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["X-Meta", "{\"n\": \"two\"}"]]}
expect: {"valid": false, "kind": "invalid_parameter", "location": "header.x-meta/n"}
