title: "A response property of the wrong type is reported by pointer"
ref: "OpenAPI 3.1.1 §4.8.17"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object, properties: {id: {type: integer}}}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{\"id\": \"x\"}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/id"}
