title: "Headers on the default response are checked"
ref: "OpenAPI 3.1.1 §4.8.21, OpenAPI 3.1.1 §4.8.16.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "default":
            description: ok
            headers:
              X-Rate-Limit:
                required: true
                schema: {type: integer, minimum: 0}
request: {"method": "GET", "path": "/r"}
response: {"status": 503}
expect: {"valid": false, "kind": "missing_parameter", "location": "header.x-rate-limit"}
