title: "A +json response is matched by application/* and parsed"
ref: "OpenAPI 3.1.1 §4.8.17, RFC 6839 §3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/*:
                schema: {type: object, required: [title]}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/problem+json"]], "body": "{\"status\": 400}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/title"}
