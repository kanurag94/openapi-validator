title: "4XX does not match a 2xx status"
ref: "OpenAPI 3.1.1 §4.8.16.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "4XX":
            description: ok
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "undeclared_status", "location": "status"}
