title: "An object header with explode true is k=v pairs"
ref: "OpenAPI 3.1.1 §4.8.21, OpenAPI 3.1.1 §4.8.12.4 (simple)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              X-Dim:
                explode: true
                schema: {type: object, properties: {w: {type: integer}, h: {type: integer}}, required: [w, h]}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["X-Dim", "w=3,h=4"]]}
expect: {"valid": true}
