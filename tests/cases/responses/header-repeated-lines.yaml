title: "Each repeated header line is checked"
ref: "OpenAPI 3.1.1 §4.8.21, RFC 9110 §5.3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              X-Count:
                schema: {type: integer}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["X-Count", "1"], ["X-Count", "x"]]}
expect: {"valid": false, "kind": "invalid_parameter", "location": "header.x-count"}
