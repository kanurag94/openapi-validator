title: "Header and body problems are both reported"
ref: "OpenAPI 3.1.1 §4.8.21, OpenAPI 3.1.1 §4.8.17"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              X-Rate-Limit:
                required: true
                schema: {type: integer, minimum: 0}
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"], ["X-Rate-Limit", "1"]], "body": "[]"}
expect: {"valid": false, "kind": "schema_violation", "location": "body"}
