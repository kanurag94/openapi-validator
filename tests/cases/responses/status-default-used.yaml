title: "default covers any code without an entry"
ref: "OpenAPI 3.1.1 §4.8.16.1 (default)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object}
          "default":
            description: ok
            content:
              application/json:
                schema: {type: object, required: [code]}
request: {"method": "GET", "path": "/r"}
response: {"status": 500, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/code"}
