title: "A declared Content-Type response header is ignored"
ref: "OpenAPI 3.1.1 §4.8.21 (Content-Type is ignored), §4.8.17"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            headers:
              Content-Type:
                required: true
                schema: {type: integer}
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": true}
