title: "A JSON null fails a non-nullable object schema"
ref: "OpenAPI 3.1.1 §4.8.17, JSON Schema Validation §6.1.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "null"}
expect: {"valid": false, "kind": "schema_violation", "location": "body"}
