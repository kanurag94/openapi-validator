document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object, required: [name, password], properties: {name: {type: string}, password: {type: string, writeOnly: true}}}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{\"name\": \"a\"}"}
