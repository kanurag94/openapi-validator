title: "4XX covers 404"
ref: "OpenAPI 3.1.1 §4.8.16.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object}
          "4XX":
            description: ok
            content:
              application/json:
                schema: {type: object, required: [error]}
request: {"method": "GET", "path": "/r"}
response: {"status": 404, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/error"}
