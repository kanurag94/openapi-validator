title: "Headers on a range response are checked"
ref: "OpenAPI 3.1.1 §4.8.21, OpenAPI 3.1.1 §4.8.16.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "4XX":
            description: ok
            headers:
              X-Rate-Limit:
                required: true
                schema: {type: integer, minimum: 0}
request: {"method": "GET", "path": "/r"}
response: {"status": 429, "headers": [["X-Rate-Limit", "1.5"]]}
expect: {"valid": false, "kind": "invalid_parameter", "location": "header.x-rate-limit"}
