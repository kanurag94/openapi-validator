title: "The range schema is not used when an exact code exists"
ref: "OpenAPI 3.1.1 §4.8.16.2 (explicit code takes precedence)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: array}
          "2XX":
            description: ok
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body"}
