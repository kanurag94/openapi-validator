title: "A response given by $ref is applied"
ref: "OpenAPI 3.1.1 §4.8.17, §4.8.23"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200": {$ref: "#/components/responses/Thing"}

  components:
    responses:
      Thing:
        description: thing
        content:
          application/json:
            schema: {type: object, required: [id]}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/id"}
