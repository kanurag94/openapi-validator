title: "A required readOnly property must be in a response"
ref: "OpenAPI 3.1.1 §4.8.24.3 (readOnly/writeOnly), OpenAPI 3.1.1 §4.8.17"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object, required: [id], properties: {id: {type: integer, readOnly: true}}}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{}"}
expect: {"valid": false, "kind": "schema_violation", "location": "body/id"}
