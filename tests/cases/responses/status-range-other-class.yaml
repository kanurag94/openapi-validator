title: "2XX does not cover a 3xx code"
ref: "OpenAPI 3.1.1 §4.8.16.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "2XX":
            description: ok
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/r"}
response: {"status": 302}
expect: {"valid": false, "kind": "undeclared_status", "location": "status"}
