title: "A response to HEAD that carries content is a problem"
ref: "RFC 9110 §9.3.2 (the server MUST NOT send content in the response)"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      head:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object}
request: {"method": "HEAD", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "[[["}
expect:
  valid: false
  kind: unexpected_body
  location: body
