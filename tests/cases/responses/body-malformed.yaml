title: "Malformed response JSON is reported"
ref: "OpenAPI 3.1.1 §4.8.17, RFC 8259 §2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /r:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object}
request: {"method": "GET", "path": "/r"}
response: {"status": 200, "headers": [["Content-Type", "application/json"]], "body": "{,}"}
expect: {"valid": false, "kind": "malformed_body", "location": "body"}
