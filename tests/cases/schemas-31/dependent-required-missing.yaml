title: "dependentRequired requires billing when credit is present"
ref: "JSON Schema Validation 2020-12 §6.5.4 dependentRequired"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, dependentRequired: {credit: [billing]}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"credit\": 1}"
expect:
  valid: false
  kind: schema_violation
