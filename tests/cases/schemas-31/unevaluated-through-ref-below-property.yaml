title: "unevaluatedProperties below a property sees what an allOf reference evaluated"
ref: "JSON Schema Core 2020-12 §11.3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Root"}
        responses: {"200": {description: ok}}
  components:
    schemas:
      Root: {type: object, properties: {x: {allOf: [{$ref: "#/components/schemas/Base"}], unevaluatedProperties: false}}}
      Base: {properties: {a: {type: integer}}}
request: {method: POST, path: /x, headers: [["Content-Type", "application/json"]], body: '{"x": {"a": 1}}'}
expect: {valid: true}
