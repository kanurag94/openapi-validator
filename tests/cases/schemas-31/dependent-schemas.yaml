title: "dependentSchemas applies its schema when the trigger is present"
ref: "JSON Schema Core 2020-12 §10.2.2.4 dependentSchemas"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, dependentSchemas: {credit: {required: [billing]}}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"credit\": 1}"
expect:
  valid: false
  kind: schema_violation
