title: "unevaluatedProperties false sees properties from a sibling $ref"
ref: "JSON Schema Core 2020-12 §11.3 unevaluatedProperties; §8.2.3.1 $ref"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Base', properties: {b: {type: integer}}, unevaluatedProperties: false}
        responses: {"200": {description: ok}}
  components:
    schemas:
      Base: {type: object, properties: {a: {type: integer}}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"a\": 1, \"b\": 2}"
expect:
  valid: true
