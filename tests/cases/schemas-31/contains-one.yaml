title: "contains passes when one element matches"
ref: "JSON Schema Core 2020-12 §10.3.1.3 contains"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: array, contains: {type: string}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "[1, \"a\"]"
expect:
  valid: true
