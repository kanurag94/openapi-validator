title: "contentMediaType is an annotation and does not parse the string"
ref: "JSON Schema Validation 2020-12 §8.4 contentMediaType"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, contentMediaType: application/json}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"{\""
expect:
  valid: true
