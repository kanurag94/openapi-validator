title: "readOnly beside $ref applies in 3.1 and relaxes required in a request (gateway profile)"
ref: "JSON Schema Validation 2020-12 §9.4 readOnly/writeOnly; OpenAPI 3.1.1 §4.8.24"
options:
  profile: gateway
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, required: [id, name], properties: {id: {$ref: '#/components/schemas/Id', readOnly: true}, name: {type: string}}}
        responses: {"200": {description: ok}}
  components:
    schemas:
      Id: {type: integer}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"name\": \"x\"}"
expect:
  valid: true
