title: "additionalProperties false still ignores properties in allOf in 3.1"
ref: "JSON Schema Core 2020-12 §10.3.2.3 additionalProperties"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, allOf: [{properties: {a: {type: integer}}}], additionalProperties: false}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"a\": 1}"
expect:
  valid: false
  kind: schema_violation
  location: body/a
