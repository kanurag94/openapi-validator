title: In 3.1 formats are annotations by default
ref: JSON Schema 2020-12 Validation §7.2.1 (assertion "MUST be disabled by default")
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: email}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: '"not an email"'
expect:
  valid: true
