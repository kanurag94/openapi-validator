title: "Two CJK characters fail minLength 3"
ref: "JSON Schema Validation 2020-12 §6.3.2 minLength"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, minLength: 3}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"日本\""
expect:
  valid: false
  kind: schema_violation
  location: body
