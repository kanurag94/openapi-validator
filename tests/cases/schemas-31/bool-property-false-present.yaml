title: "A property schema of false forbids that property"
ref: "JSON Schema Core 2020-12 §4.3.2 Boolean JSON Schemas"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, properties: {secret: false}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"secret\": 1}"
expect:
  valid: false
  kind: schema_violation
  location: body/secret
