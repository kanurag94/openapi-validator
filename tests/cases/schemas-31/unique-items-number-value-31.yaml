title: "1 and 1.0 are equal for uniqueItems"
ref: "JSON Schema Validation 2020-12 §6.4.3 uniqueItems; JSON Schema Core 2020-12 §4.2.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: array, uniqueItems: true}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "[1, 1.0]"
expect:
  valid: false
  kind: schema_violation
  location: body
