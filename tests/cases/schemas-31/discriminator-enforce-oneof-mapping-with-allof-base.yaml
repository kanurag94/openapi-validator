      post:
        requestBody: {content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/Cat'}], discriminator: {propertyName: kind, mapping: {c: '#/components/schemas/Cat'}}}}}}
        responses: {'200': {description: ok}}
