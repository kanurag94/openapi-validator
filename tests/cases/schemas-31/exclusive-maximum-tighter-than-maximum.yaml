title: "exclusiveMaximum and maximum both apply"
ref: "JSON Schema Validation 2020-12 §6.2.2, §6.2.3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: number, maximum: 20, exclusiveMaximum: 10}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "15"
expect:
  valid: false
  kind: schema_violation
  location: body
