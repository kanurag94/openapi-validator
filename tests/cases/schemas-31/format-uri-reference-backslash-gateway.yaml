title: "format uri-reference: a backslash is not allowed (gateway profile)"
ref: "JSON Schema Validation 2020-12 §7.3; RFC 3986 §2"
options:
  profile: gateway
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: uri-reference}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"a\\\\b\""
expect:
  valid: false
  kind: schema_violation
  location: body
