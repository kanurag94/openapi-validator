title: "format hostname: a label cannot end with a hyphen"
ref: "JSON Schema Validation 2020-12 §7.3; RFC 1123 §2.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: hostname}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"ab-.example\""
expect:
  valid: false
  kind: schema_violation
  location: body
