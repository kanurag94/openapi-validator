title: "maxLength written as 1e1 is a count of 10"
ref: "JSON Schema Validation 2020-12 §6.3.1 maxLength"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, maxLength: 1e1}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"abcdefghijk\""
expect:
  valid: false
  kind: schema_violation
  location: body
