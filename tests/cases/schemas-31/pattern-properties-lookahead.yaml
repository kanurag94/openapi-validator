title: patternProperties keys may use lookahead
ref: "JSON Schema 2020-12 Core §10.3.2.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, patternProperties: {'^(?!x-)': {type: integer}}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: '{"a": "s", "x-b": "s"}'
expect:
  valid: false
  location: body/a
