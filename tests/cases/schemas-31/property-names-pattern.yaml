title: "propertyNames pattern rejects an upper-case name"
ref: "JSON Schema Core 2020-12 §10.3.2.4 propertyNames"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, propertyNames: {pattern: '^[a-z]+$'}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"Ab\": 1}"
expect:
  valid: false
  kind: schema_violation
