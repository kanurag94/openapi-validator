title: "unevaluatedProperties as a schema checks leftover values"
ref: "JSON Schema Core 2020-12 §11.3 unevaluatedProperties"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, properties: {a: {}}, unevaluatedProperties: {type: integer}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"a\": \"x\", \"z\": \"s\"}"
expect:
  valid: false
  kind: schema_violation
