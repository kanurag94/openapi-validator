title: "format uri: scheme, authority, path, query, fragment"
ref: "JSON Schema Validation 2020-12 §7.3; RFC 3986 §3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: uri}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"https://example.com/a?b=c#d\""
expect:
  valid: true
