title: "A property schema of false allows its absence"
ref: "JSON Schema Core 2020-12 §4.3.2 Boolean JSON Schemas"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: object, properties: {secret: false}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"other\": 1}"
expect:
  valid: true
