title: "format uuid: hex digits are case-insensitive on input"
ref: "JSON Schema Validation 2020-12 §7.3; RFC 4122 §3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: uuid}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"123E4567-E89B-12D3-A456-426614174000\""
expect:
  valid: true
