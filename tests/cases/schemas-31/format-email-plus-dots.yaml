title: "format email: dots and plus in the local part"
ref: "JSON Schema Validation 2020-12 §7.3; RFC 5321 §4.1.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: email}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"first.last+tag@sub.example.org\""
expect:
  valid: true
