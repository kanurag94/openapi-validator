title: "format duration is an annotation here"
ref: "JSON Schema Validation 2020-12 §7.2; §7.3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: string, format: duration}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"not a duration\""
expect:
  valid: true
