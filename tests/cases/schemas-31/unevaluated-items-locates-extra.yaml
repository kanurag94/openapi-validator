title: "An extra item under unevaluatedItems: false is reported where it is"
ref: "JSON Schema Core 2020-12 §11.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /p:
      post:
        requestBody:
          content:
            application/json:
              schema: {type: array, prefixItems: [{type: string}], unevaluatedItems: false}
        responses:
          "200": {description: ok}
  components:
    schemas:
      Unused: {type: string}
request: {method: POST, path: /p, headers: [["Content-Type", "application/json"]], body: '["a", 2]'}
expect: {valid: false, kind: schema_violation, location: body/1}
