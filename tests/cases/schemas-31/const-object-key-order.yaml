title: "const object equality ignores key order"
ref: "JSON Schema Validation 2020-12 §6.1.3 const; JSON Schema Core 2020-12 §4.2.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {const: {a: 1, b: [1, 2]}}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "{\"b\": [1, 2], \"a\": 1}"
expect:
  valid: true
