title: "format ipv4 without type ignores a number"
ref: "JSON Schema Validation 2020-12 §7.3"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {format: ipv4}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "12"
expect:
  valid: true
