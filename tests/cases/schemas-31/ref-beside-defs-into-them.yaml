title: "A $ref beside $defs may point into those $defs"
ref: "JSON Schema Core 2020-12 §8.2.4, §8.2.3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /p:
      post:
        requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/S'}}}}
        responses: {'200': {description: ok}}
  components:
    schemas:
      S:
        $ref: '#/components/schemas/S/$defs/inner'
        $defs:
          inner: {type: object, required: [a]}
request: {method: POST, path: /p, headers: [["Content-Type","application/json"]], body: "{}"}
expect: {valid: false}
