title: "A required writeOnly property may be omitted from a response"
ref: "JSON Schema Validation 2020-12 §9.4 readOnly/writeOnly; OpenAPI 3.1.1 §4.8.24"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      get:
        responses:
          "200":
            description: ok
            content:
              application/json:
                schema: {type: object, required: [secret], properties: {secret: {type: string, writeOnly: true}}}
request: {method: GET, path: /t}
response:
  status: 200
  headers: [["Content-Type", "application/json"]]
  body: "{}"
expect:
  valid: true
