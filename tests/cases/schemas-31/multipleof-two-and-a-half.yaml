title: "7.5 is a multiple of 2.5"
ref: "JSON Schema Validation 2020-12 §6.2.1 multipleOf"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {type: number, multipleOf: 2.5}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "7.5"
expect:
  valid: true
