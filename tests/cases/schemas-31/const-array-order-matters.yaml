title: "const array equality respects element order"
ref: "JSON Schema Validation 2020-12 §6.1.3 const; JSON Schema Core 2020-12 §4.2.2"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {const: [1, 2]}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "[2, 1]"
expect:
  valid: false
  kind: schema_violation
  location: body
