title: "A schema that only refers to itself, reached through a property, accepts the value"
ref: "JSON Schema Core 2020-12 §8.2.3.1"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /x:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Root"}
        responses: {"200": {description: ok}}
  components:
    schemas:
      Root: {type: object, properties: {x: {anyOf: [{$ref: "#/components/schemas/S"}]}}}
      S: {anyOf: [{$ref: "#/components/schemas/S"}, {$ref: "#/components/schemas/S"}]}
request: {method: POST, path: /x, headers: [["Content-Type", "application/json"]], body: '{"x": 1}'}
expect: {valid: true}
