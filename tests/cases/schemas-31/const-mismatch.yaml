title: "const rejects a different value"
ref: "JSON Schema Validation 2020-12 §6.1.3 const"
document: |
  openapi: 3.1.0
  info: {title: t, version: "1"}
  paths:
    /t:
      post:
        requestBody:
          required: true
          content:
            application/json:
              schema: {const: 'on'}
        responses: {"200": {description: ok}}
request:
  method: POST
  path: /t
  headers: [["Content-Type", "application/json"]]
  body: "\"off\""
expect:
  valid: false
  kind: schema_violation
  location: body
