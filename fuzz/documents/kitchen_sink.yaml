openapi: 3.1.0
info: {title: fuzz, version: "1"}
servers:
  - url: https://api.example.com/{v}
    variables: {v: {default: v1, enum: [v1, v2]}}
security:
  - key: []
  - bearer: []
  - {}
paths:
  /pets/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    get:
      parameters:
        - {name: tags, in: query, schema: {type: array, items: {type: string, pattern: '^\w+$'}, maxItems: 4}}
        - {name: f, in: query, style: deepObject, schema: {type: object, properties: {min: {type: number}, max: {type: number}}}}
        - {name: sort, in: query, style: pipeDelimited, explode: false, schema: {type: array, items: {enum: [a, b]}}}
        - {name: X-Ids, in: header, schema: {type: array, items: {type: integer}}}
        - {name: sid, in: cookie, schema: {type: string, format: uuid}}
        - {name: q, in: query, content: {application/json: {schema: {$ref: '#/components/schemas/Pet'}}}}
      responses:
        "200":
          description: ok
          headers:
            X-Rate: {required: true, schema: {type: integer, maximum: 100}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Pet'}}
        2XX: {description: ok, content: {application/xml: {}}}
        default: {description: err, content: {application/problem+json: {schema: {type: object, required: [code]}}}}
  /m/{lbl}/{mat}:
    get:
      parameters:
        - {name: lbl, in: path, required: true, style: label, explode: true, schema: {type: array, items: {type: integer}}}
        - {name: mat, in: path, required: true, style: matrix, explode: true, schema: {type: object, properties: {a: {type: string}}}}
      responses: {"204": {description: none}}
  /pets:
    post:
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Pet'}}
          application/x-www-form-urlencoded:
            schema: {$ref: '#/components/schemas/Pet'}
            encoding: {tags: {style: spaceDelimited, explode: false}}
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}, meta: {$ref: '#/components/schemas/Pet'}}
          text/plain: {schema: {type: string, maxLength: 64}}
          application/xml: {schema: {type: object}}
      responses: {"201": {description: created}}
components:
  securitySchemes:
    key: {type: apiKey, in: header, name: X-Key}
    bearer: {type: http, scheme: bearer}
  schemas:
    Pet:
      type: object
      required: [name, kind]
      properties:
        id: {type: integer, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string}
        tags: {type: array, items: {type: string}, uniqueItems: true}
        born: {type: string, format: date}
        site: {type: string, format: uri}
        price: {type: number, multipleOf: 0.01, exclusiveMinimum: 0}
        child: {$ref: '#/components/schemas/Pet'}
        extra: {anyOf: [{type: string}, {$ref: '#/components/schemas/Pet'}, {type: 'null'}]}
      oneOf:
        - {$ref: '#/components/schemas/Dog'}
        - {$ref: '#/components/schemas/Cat'}
      discriminator: {propertyName: kind}
    Dog:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
        - {properties: {bark: {type: boolean}}}
    Cat:
      allOf:
        - {$ref: '#/components/schemas/Pet'}
        - {properties: {meow: {type: boolean}}, not: {required: [bark]}}
