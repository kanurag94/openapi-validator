[workspace]
members = [".", "ffi"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/kanurag94/openapi-validator"

[package]
name = "openapi-validator"
description = "Validate HTTP requests and responses against OpenAPI 3.0, 3.1 and 3.2 documents at runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["openapi", "validation", "json-schema", "gateway", "http"]
categories = ["web-programming", "parser-implementations"]

[dependencies]
jsonschema = { version = "0.59", default-features = false, features = ["arbitrary-precision"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
regex = "1"
fancy-regex = "0.19"
num-bigint = "0.4"
num-traits = "0.2"
saphyr-parser = "0.2"
roxmltree = "0.21"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "6"
idna = "1"
unicode-normalization = "0.1"
jsonschema-regex = "0.59"

[profile.bench]
debug = true

[dev-dependencies]
regex-syntax = "0.8"
jsonschema-regex = "0.59"
proptest = "1"
criterion = { version = "0.5", default-features = false }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

[[bench]]
name = "build"
harness = false

[[bench]]
name = "calls"
harness = false

[[bench]]
name = "pathological"
harness = false
