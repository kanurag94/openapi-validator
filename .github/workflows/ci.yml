name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Benches compile
        run: cargo bench --no-run

  test:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.88"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test --workspace
      - name: Stack and work limits (release)
        run: cargo test --release --test limits

  ffi-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: cargo build --release -p openapi-validator-ffi
      - name: Go cgo test
        working-directory: ffi/go
        run: |
          go vet ./...
          GOEXPERIMENT=cgocheck2 go test -count=1 -race ./...

  json-schema-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the official suite (not vendored)
        run: git clone --depth 1 https://github.com/json-schema-org/JSON-Schema-Test-Suite.git "$RUNNER_TEMP/jsts"
      - name: Run draft 2020-12 through the OpenAPI 3.1 path
        run: JSON_SCHEMA_TEST_SUITE="$RUNNER_TEMP/jsts" cargo test --release --test json_schema_suite -- --nocapture
